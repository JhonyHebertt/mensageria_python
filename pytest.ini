[pytest]
# Configuração do Pytest para este projeto

# Minimo verbosity para output limpo
addopts = 
    --strict-markers
    --tb=short
    --disable-warnings

# Marcadores customizados
markers =
    smoke: Testes rápidos de saúde do sistema (rodas frequentemente)
    slow: Testes lentos de performance (rodar ocasionalmente)
    integration: Testes de integração completos
    unit: Testes unitários
    database: Testes específicos do banco de dados
    api: Testes da API
    error: Testes de tratamento de erros
    performance: Testes de performance e throughput

# Diretórios de testes
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Timeout padrão (em segundos)
timeout = 60

# Mostrar print em caso de sucesso
console_output_style = progress

# Cobertura
[coverage:run]
source = .
omit = 
    */tests/*
    */test_*.py
    setup.py
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
